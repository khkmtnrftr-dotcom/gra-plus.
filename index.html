<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Гра+ — Збери монети</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#151d33;--text:#eef3ff;--muted:#9eaccb;--accent:#69e3c1}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 50% 0,#1c2c50,var(--bg) 65%);color:var(--text);font:16px system-ui,sans-serif}main{width:min(900px,100%)}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px;flex-wrap:wrap}h1{margin:0;font-size:clamp(25px,5vw,38px);letter-spacing:-.04em}h1 span{color:var(--accent)}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:var(--panel);border:1px solid #2b3858;border-radius:12px;padding:9px 14px;color:var(--muted)}.stat b{color:var(--text);margin-left:6px;font-variant-numeric:tabular-nums}.stage{position:relative;overflow:hidden;border:1px solid #344363;border-radius:18px;background:#0e172a;box-shadow:0 22px 70px #0008}canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;background:#081020c9;backdrop-filter:blur(5px)}.overlay.hidden{display:none}.dialog{max-width:440px}.dialog h2{font-size:clamp(26px,5vw,42px);margin:0 0 8px}.dialog p{color:var(--muted);line-height:1.5}button{border:0;border-radius:12px;padding:12px 20px;color:#07131c;background:var(--accent);font-weight:800;font-size:16px;cursor:pointer}button:hover{filter:brightness(1.08)}footer{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:13px;color:var(--muted);font-size:14px}.mobile{display:none;gap:8px;justify-content:center;margin-top:14px}.mobile button{min-width:56px;padding:12px;background:#263654;color:var(--text);border:1px solid #405273}@media(max-width:650px){.mobile{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,48px)}.mobile button:nth-child(1){grid-column:2}.mobile button:nth-child(2){grid-column:1;grid-row:2}.mobile button:nth-child(3){grid-column:2;grid-row:2}.mobile button:nth-child(4){grid-column:3;grid-row:2}}
</style>
</head>
<body><main>
<header><h1>Гра<span>+</span></h1><div class="stats"><div class="stat">Рахунок <b id="score">0</b></div><div class="stat">Швидкість ворога <b id="speed">120</b> px/с</div></div></header>
<section class="stage"><canvas id="game" width="960" height="540" aria-label="Ігрове поле"></canvas><div class="overlay" id="overlay"><div class="dialog"><h2 id="message">Збери монети!</h2><p id="help">Керуй синім гравцем за допомогою WASD або стрілок. Уникай червоного переслідувача — з кожними 5 монетами він стає швидшим.</p><button id="start">Почати гру</button></div></div></section>
<div class="mobile" aria-label="Керування на телефоні"><button data-dir="up">▲</button><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div><footer><span>Керування: WASD / стрілки</span><span>Збери якомога більше монет ✦</span></footer>
</main>
<script>
(()=>{const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),speedEl=document.getElementById('speed'),overlay=document.getElementById('overlay'),message=document.getElementById('message'),help=document.getElementById('help'),startBtn=document.getElementById('start'),W=canvas.width,H=canvas.height,keys=new Set();let player,enemy,coin,score,running=false,last=0,raf=0,audioCtx;const rand=(a,b)=>a+Math.random()*(b-a);
function newCoin(){let p;do{p={x:rand(34,W-34),y:rand(34,H-34),r:11}}while(player&&Math.hypot(p.x-player.x,p.y-player.y)<100);coin=p}
function reset(){score=0;player={x:W*.28,y:H*.5,r:15,speed:260};enemy={x:W*.76,y:H*.5,r:18};newCoin();updateHud()}
function enemySpeed(){return 120+Math.floor(score/5)*10}function updateHud(){scoreEl.textContent=score;speedEl.textContent=enemySpeed()}
function coinSound(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sine';osc.frequency.setValueAtTime(740,audioCtx.currentTime);osc.frequency.exponentialRampToValueAtTime(1180,audioCtx.currentTime+.085);gain.gain.setValueAtTime(.12,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.13);osc.connect(gain);gain.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+.14)}catch(e){}}
function endGame(){running=false;cancelAnimationFrame(raf);message.textContent='Гру завершено!';help.textContent=`Твій результат: ${score} монет. Спробуй ще раз і побий рекорд!`;startBtn.textContent='Грати ще';overlay.classList.remove('hidden')}
function update(dt){let dx=0,dy=0;if(keys.has('arrowleft')||keys.has('a'))dx--;if(keys.has('arrowright')||keys.has('d'))dx++;if(keys.has('arrowup')||keys.has('w'))dy--;if(keys.has('arrowdown')||keys.has('s'))dy++;const len=Math.hypot(dx,dy)||1;player.x=Math.max(player.r,Math.min(W-player.r,player.x+dx/len*player.speed*dt));player.y=Math.max(player.r,Math.min(H-player.r,player.y+dy/len*player.speed*dt));const ex=player.x-enemy.x,ey=player.y-enemy.y,dist=Math.hypot(ex,ey)||1,v=enemySpeed()*dt;enemy.x+=ex/dist*v;enemy.y+=ey/dist*v;if(Math.hypot(player.x-coin.x,player.y-coin.y)<player.r+coin.r){score++;coinSound();newCoin();updateHud()}if(Math.hypot(player.x-enemy.x,player.y-enemy.y)<player.r+enemy.r)endGame()}
function circle(x,y,r,color){ctx.save();ctx.shadowColor=color;ctx.shadowBlur=18;ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#0e172a';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#1c2b47';ctx.lineWidth=1;for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}circle(coin.x,coin.y,coin.r,'#ffd166');ctx.fillStyle='#fff2b8';ctx.font='bold 15px system-ui';ctx.textAlign='center';ctx.fillText('✦',coin.x,coin.y+5);circle(enemy.x,enemy.y,enemy.r,'#ff4d5e');circle(player.x,player.y,player.r,'#55a7ff');ctx.fillStyle='#d8eaff';ctx.font='bold 10px system-ui';ctx.fillText('YOU',player.x,player.y+4)}
function loop(t){if(!running)return;const dt=Math.min((t-last)/1000||0,.04);last=t;update(dt);draw();if(running)raf=requestAnimationFrame(loop)}
function start(){cancelAnimationFrame(raf);reset();running=true;overlay.classList.add('hidden');startBtn.textContent='Почати гру';last=performance.now();draw();raf=requestAnimationFrame(loop)}
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();keys.add(k)});window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>keys.clear());document.querySelectorAll('[data-dir]').forEach(btn=>{const dir=btn.dataset.dir,map={up:'arrowup',down:'arrowdown',left:'arrowleft',right:'arrowright'};btn.addEventListener('pointerdown',e=>{e.preventDefault();keys.add(map[dir])});['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev,()=>keys.delete(map[dir])))});startBtn.addEventListener('click',start);reset();draw()})();
</script></body></html>
